<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acceso administrativo</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
<div class="login-card">
  <img src="{{ url_for('static', filename='escudo-policia-cordoba.jpeg') }}" alt="Escudo">
  <p class="kicker">PANEL PRIVADO</p>
  <h1>Administración</h1>
  <p>Ingresá para editar la información publicada en el sitio.</p>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}
  {% endwith %}
  <form method="post">
    <label>Contraseña</label>
    <input type="password" name="password" required autofocus>
    <button class="btn primary full" type="submit">Ingresar</button>
  </form>
  <a href="{{ url_for('index') }}">← Volver al sitio</a>
</div>
</body>
</html>
